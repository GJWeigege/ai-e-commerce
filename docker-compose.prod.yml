# 生产编排：Postgres + Redis + API + Web(Nginx)
# 兼容 docker-compose 1.x（旧版）与 Docker Compose V2
# 用法：
#   cp deploy/.env.prod.example .env.prod
#   # 旧版若无 --env-file，可再：cp .env.prod .env
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   # 或：docker-compose -f docker-compose.prod.yml up -d --build
#
# 外层可用宿主机 Nginx 做 HTTPS，反代到本机 8080（或改 WEB_PUBLISH_PORT）

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aiecom}
    volumes:
      - aiecom_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: aiecom-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aiecom_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: aiecom-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiecom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiecom}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      WEB_ORIGIN: ${WEB_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      CHROME_EXTENSION_IDS: ${CHROME_EXTENSION_IDS:-}
      UPLOAD_ROOT: /app/uploads
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_MODEL: ${CURSOR_MODEL:-composer-2.5}
      CURSOR_AGENT_RUNTIME: ${CURSOR_AGENT_RUNTIME:-cloud}
      WB_LOCALE: ${WB_LOCALE:-ru}
      WB_LISTING_CONCURRENCY: ${WB_LISTING_CONCURRENCY:-4}
      WB_DEFAULT_SUBJECT_ID: ${WB_DEFAULT_SUBJECT_ID:-}
      WB_WAREHOUSE_ID: ${WB_WAREHOUSE_ID:-}
      WB_CONTENT_API_BASE: ${WB_CONTENT_API_BASE:-}
      WB_PRICES_API_BASE: ${WB_PRICES_API_BASE:-}
      WB_MARKETPLACE_API_BASE: ${WB_MARKETPLACE_API_BASE:-}
      WB_CATALOG_DIR: /app/config/wb-catalog
      WB_CATALOG_TTL_DAYS: ${WB_CATALOG_TTL_DAYS:-14}
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    volumes:
      - aiecom_uploads:/app/uploads
      - aiecom_wb_catalog:/app/config/wb-catalog
    depends_on:
      - postgres
      - redis
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: aiecom-web
    restart: unless-stopped
    ports:
      - "${WEB_PUBLISH_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - internal

volumes:
  aiecom_pg_data:
  aiecom_redis_data:
  aiecom_uploads:
  aiecom_wb_catalog:

networks:
  internal:
    driver: bridge
