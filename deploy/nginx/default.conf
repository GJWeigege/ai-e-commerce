server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Docker 内置 DNS。变量 proxy_pass 把解析推迟到请求时，api 重启时 nginx 仍能启动。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 浏览器与同源 API；Chrome 插件也可直接打 https://域名/api/v1
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /healthz {
        set $api_health http://api:3000/api/v1/health;
        proxy_pass $api_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
