services:
  postgres:
    image: postgres:16-alpine
    container_name: aiecom-postgres
    environment:
      POSTGRES_USER: aiecom
      POSTGRES_PASSWORD: aiecom
      POSTGRES_DB: aiecom
    ports:
      - "5433:5432"
    volumes:
      - aiecom_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiecom -d aiecom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aiecom-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aiecom_pg_data:
